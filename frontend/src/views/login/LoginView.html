<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecoinv - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../../public/assets/css/styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center">

    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h2 class="text-primary fw-bold">Ecoinv♻</h2>
            <p class="text-muted">Control de Inventario de Tóners</p>
        </div>

        <div id="error-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" required placeholder="usuario@empresa.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Ingresar al Sistema</button>
        </form>
    </div>

    <script src="../../services/api.js"></script>
    <script>
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById("error-alert");
            alertEl.classList.add("d-none");

            try {
                const data = await api.login(
                    document.getElementById("email").value,
                    document.getElementById("password").value
                );

                localStorage.setItem("ecoinv_token", data.access_token);
                localStorage.setItem("ecoinv_rol", data.rol);

                if (data.rol === "SUPERADMIN") {
                    window.location.href = "../admin/DashboardAdmin.html";
                } else {
                    window.location.href = "../client/DashboardCliente.html";
                }
            } catch (err) {
                alertEl.innerText = err.message;
                alertEl.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
